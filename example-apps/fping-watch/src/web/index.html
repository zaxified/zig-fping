<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fping-watch</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>fping-watch</h1>
      <span id="mode" class="tag" hidden>read-only demo</span>
    </div>
    <div id="summary" class="summary"></div>
  </header>

  <main>
    <div class="toolbar">
      <input id="find" type="search" placeholder="Find a name, host or tag" aria-label="Find a target" maxlength="100">
      <span class="order">
        <select id="sort" aria-label="Order of the list" title="Order of the list"></select>
        <button id="order" type="button"></button>
      </span>
      <div id="tagbar" class="tagbar" role="group" aria-label="Filter by tag" hidden></div>
      <span id="shown" class="note"></span>
    </div>

    <section id="targets" class="targets" aria-live="polite">
      <p class="empty">Loading…</p>
    </section>

    <form id="add" class="add">
      <input name="name" title="Shown in the list" placeholder="Name" maxlength="64" required>
      <input name="host" title="IPv4 or IPv6 address, or a DNS name (resolved every cycle)" placeholder="IP address or host name" maxlength="253" required>
      <input name="tags" title="Optional labels to filter the list by, separated by spaces (at most 8)" placeholder="Tags (optional)" maxlength="300">
      <button type="submit" title="Start probing this host once a minute">Add target</button>
      <span id="add-error" class="error" role="alert"></span>
    </form>
  </main>

  <footer>
    <span id="updated"></span>
    · built with <a href="https://github.com/zaxified/zig-fping">zig-fping</a>
  </footer>

  <template id="row">
    <article class="target">
      <div class="head">
        <button class="expand" type="button" aria-expanded="false" title="Show or hide the 24-hour chart and the actions"></button>
        <span class="badge"></span>
        <span class="who">
          <span class="line"><span class="name"></span><button class="edit-btn edit-target" type="button" data-focus="edit-target" title="Rename, or change the host" aria-label="Rename, or change the host">✎</button></span>
          <span class="host"></span>
          <span class="line tagline"><span class="tags"></span><button class="edit-btn edit-tags" type="button" data-focus="edit-tags" title="Edit the tags: labels to filter the list by, e.g. a site, a customer or a service" aria-label="Edit the tags"></button></span>
        </span>
        <span class="beats" aria-hidden="true"></span>
        <span class="figures"><span class="uptime"></span><span class="latency"></span></span>
      </div>
      <div class="detail" hidden>
        <div class="chart"></div>
        <div class="stats"></div>
        <div class="actions"></div>
      </div>
    </article>
  </template>
</body>
</html>
