name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Reference binaries for the golden-diff suite (test/golden.sh): the
      # distro fping (5.1 on ubuntu-latest, the oldest supported reference)
      # plus fping 5.5 built from the release tarball by
      # scripts/fping-ref.sh (the "Compatible-with release"). The test
      # pipeline diffs against both. The 5.5 build is cached across runs.
      - name: Install reference fping 5.1
        run: sudo apt-get update && sudo apt-get install -y fping

      - name: Cache reference fping 5.5
        uses: actions/cache@v4
        with:
          path: .zig-cache/fping-ref-5.5
          key: fping-ref-5.5-${{ hashFiles('scripts/fping-ref.sh') }}

      - name: Build reference fping 5.5
        run: sh scripts/fping-ref.sh

      # Same artifacts as a local `scripts/release.sh` run.
      # Same runner setup as ci.yml: scripts/release.sh runs scripts/test.sh,
      # whose unit tests run in an unprivileged user+network namespace with
      # live ICMP sockets.
      - name: Allow unprivileged ICMP sockets and user namespaces
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi

      - name: Build release artifacts
        run: sh scripts/release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "zfping $GITHUB_REF_NAME" \
            --notes "Static Linux binaries (no libc needed), and the fping-watch demo as Debian packages. See CHANGELOG.md for details." \
            "releases/v$version"/zfping-*.tar.gz "releases/v$version"/fping-watch_*.deb "releases/v$version/SHA256SUMS"
