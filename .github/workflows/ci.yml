name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Fuzzing is run on demand (see the `fuzz` job): the seeds are
  # deterministic, so a schedule would only repeat the same inputs over
  # unchanged code. Trigger it after touching a parser.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Reference binaries for the golden-diff suite (test/golden.sh): the
      # distro fping (5.1 on ubuntu-latest, the oldest supported reference)
      # plus fping 5.5 built from the release tarball by
      # scripts/fping-ref.sh (the "Compatible-with release"). The test
      # pipeline diffs against both. The 5.5 build is cached across runs.
      - name: Install reference fping 5.1
        run: sudo apt-get update && sudo apt-get install -y fping

      - name: Cache reference fping 5.5
        uses: actions/cache@v4
        with:
          path: .zig-cache/fping-ref-5.5
          key: fping-ref-5.5-${{ hashFiles('scripts/fping-ref.sh') }}

      - name: Build reference fping 5.5
        run: sh scripts/fping-ref.sh

      # Open ping_group_range so the embed-API unit test (opens an ICMP
      # socket against loopback) actually runs instead of self-skipping; the
      # runner otherwise denies unprivileged ICMP and `zig build test` reports
      # one skipped test.
      - name: Allow unprivileged ICMP sockets
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      # Same entry point as local development: scripts/test.sh runs
      # fmt --check, build, unit tests, the namespaced functional suite
      # and the golden-diff comparison against the reference fping.
      - name: Test pipeline
        run: sh scripts/test.sh

      # Cross-compile every other supported target in the same job so they all
      # share one coherent Zig cache, instead of a matrix that fought over a
      # single cache key (one target hit, the rest missed). Zig cross-compiles
      # out of the box — no sysroots or toolchains. Runs even if the test step
      # failed, so a broken cross-compile still surfaces in the same run.
      - name: Cross-compile
        if: ${{ !cancelled() }}
        run: |
          for t in aarch64-linux riscv64-linux x86_64-linux-musl x86-linux arm-linux riscv32-linux; do
            echo "==> $t"
            zig build -Dtarget="$t" -Doptimize=ReleaseSafe
          done

      # 32-bit x86 binaries run natively on the x86_64 runner, so the unit
      # tests also cover 32-bit usize/isize and the 32-bit syscall ABI.
      - name: Unit tests (x86 32-bit)
        if: ${{ !cancelled() }}
        run: zig build test -Dtarget=x86-linux -Doptimize=ReleaseSafe --summary all

  # Fuzzing runs only on manual dispatch: scripts/fuzz.sh builds the test
  # binaries once (LLVM, ReleaseSafe) and drives every harness from
  # deterministic seeds, one process per core, with a hang watchdog.
  fuzz:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fuzz (60s window, deterministic seeds)
        run: sh scripts/fuzz.sh 60
